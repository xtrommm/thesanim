<style>
:root{color-scheme:dark;--bg:#0B0A1A;--panel:#14122B;--line:#2A2652;--ink:#E8E6FF;--muted:#9A96C8;--pink:#FF4DA6;--cyan:#4DE1FF;--green:#5CFF9D}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.75 "JetBrains Mono",Menlo,Consolas,monospace}
body{display:grid;place-items:center;padding:1.5rem;box-sizing:border-box}
.win{width:min(560px,100%);background:var(--panel);border:1px solid var(--green);border-radius:12px;padding:1.4rem}
h1{font-size:clamp(3rem,16vw,5.5rem);line-height:1;margin:.2rem 0;text-shadow:3px 0 var(--pink),-3px 0 var(--cyan)}
.p{color:var(--green);font-weight:700}.m{color:var(--muted)}
a{display:inline-block;margin-top:1rem;padding:.7rem 1.2rem;border:2px solid var(--pink);border-radius:8px;color:var(--pink);font-weight:700;text-decoration:none}
a:hover{background:var(--pink);color:var(--bg)}
a:focus-visible{outline:3px solid #FFD84D;outline-offset:3px}
</style>
</head>

<main class="win">
<div><span class="p">$</span> cd /this-page</div>
